<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audio Lab — ROADSTER FLIGHT</title>
    <style>
      html, body, #root { overflow-y: auto !important; overflow-x: hidden; height: auto !important; min-height: 100%; user-select: text !important; touch-action: auto !important; }
      body { background: #121417; }
      .lab { max-width: 1560px; margin: 0 auto; padding: 22px 26px 60px; font-size: 13px; color: #e6dfd3; }
      .top { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
      .brand { font-family: var(--font-display); letter-spacing: 0.32em; font-size: 15px; color: #f1ede6; white-space: nowrap; }
      .brand small { display: block; font-family: var(--font-ui); letter-spacing: 0.18em; font-size: 10px; color: #7d848d; margin-top: 4px; }
      .pill { font-family: var(--font-mono); font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid #30353b; color: #a3aab2; text-transform: uppercase; letter-spacing: 0.08em; }
      .pill.on { color: #38e8ff; border-color: rgba(56, 232, 255, 0.45); box-shadow: 0 0 12px rgba(56, 232, 255, 0.15) inset; }
      .meter { flex: 1; height: 54px; border: 1px solid #24282d; border-radius: 8px; background: #0e1013; }
      .grid { display: grid; grid-template-columns: 300px 360px 1fr; gap: 14px; align-items: start; }
      @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
      .panel { background: linear-gradient(180deg, #1a1d21, #16191c); border: 1px solid #24282d; border-radius: 10px; padding: 14px 14px 12px; }
      .panel h2 { margin: 0 0 12px; font-family: var(--font-display); font-weight: 400; font-size: 10.5px; letter-spacing: 0.26em; color: #a3aab2; }
      .panel h3 { margin: 12px 0 6px; font-size: 10px; letter-spacing: 0.16em; color: #7d848d; text-transform: uppercase; font-weight: 600; }
      .row { display: grid; grid-template-columns: 92px 1fr 48px; align-items: center; gap: 8px; margin: 6px 0; }
      .row label { color: #a3aab2; font-size: 12px; }
      .row output { font-family: var(--font-mono); font-size: 11px; color: #c6cbd1; text-align: right; }
      input[type='range'] { width: 100%; accent-color: #38e8ff; }
      select { background: #121417; color: #e6dfd3; border: 1px solid #30353b; border-radius: 6px; padding: 3px 6px; font: inherit; }
      .btns { display: flex; flex-wrap: wrap; gap: 6px; }
      button { font: inherit; font-size: 12px; color: #e6dfd3; background: #24282d; border: 1px solid #30353b; border-radius: 6px; padding: 6px 10px; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
      button:hover { border-color: #7d848d; background: #2a2f35; }
      button.primary { border-color: rgba(56, 232, 255, 0.55); color: #7ff3ff; background: rgba(56, 232, 255, 0.08); }
      button.sel { border-color: #38e8ff; color: #38e8ff; }
      button.warn { border-color: rgba(255, 122, 28, 0.5); color: #ffb36b; }
      button.danger { border-color: rgba(255, 74, 74, 0.5); color: #ff9a9a; }
      .check { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: #a3aab2; }
      .check input { accent-color: #38e8ff; }
      .debug { font-family: var(--font-mono); font-size: 11px; color: #7d848d; line-height: 1.55; white-space: pre; margin-top: 10px; min-height: 120px; }
      .results { margin-top: 10px; }
      .summary { font-family: var(--font-mono); font-size: 12px; margin: 4px 0 10px; }
      .summary.ok { color: #7ff3ff; }
      .summary.bad { color: #ff9a9a; }
      table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11px; }
      th { text-align: left; color: #7d848d; font-weight: 400; padding: 3px 6px; border-bottom: 1px solid #30353b; }
      td { padding: 3px 6px; border-bottom: 1px solid #1f2328; color: #c6cbd1; white-space: nowrap; }
      td.name { font-family: var(--font-ui); color: #e6dfd3; }
      td.points { white-space: normal; line-height: 1.5; color: #a3aab2; }
      table.layers td.name { white-space: normal; min-width: 280px; max-width: 440px; }
      td.pass { color: #38e8ff; }
      td.fail { color: #ff6b6b; }
      .bands { display: inline-flex; width: 120px; height: 9px; border-radius: 2px; overflow: hidden; vertical-align: middle; background: #24282d; }
      .bands span { display: block; height: 100%; }
      .legend { font-family: var(--font-ui); font-size: 10px; color: #7d848d; margin: 4px 0 8px; }
      .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 10px; vertical-align: -1px; }
      .bar { display: inline-block; height: 8px; border-radius: 2px; background: #38e8ff; vertical-align: middle; opacity: 0.8; }
      .note { color: #7d848d; font-size: 11.5px; line-height: 1.5; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./audio.tsx"></script>
  </body>
</html>
